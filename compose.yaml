services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Qdrant is a derived search index. Kasane serves everything from
      # PostgreSQL (with full-text search fallback) while it is down, so a
      # broken Qdrant must never block the app from starting.
      qdrant:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "kasane", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # Keep credentials out of the URI so reserved characters remain literal.
      DATABASE_URL: postgres://postgres:5432?sslmode=disable
      PGUSER: ${POSTGRES_USER:-kasane}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-kasane}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DECISION_API_URL: ${DECISION_API_URL:-}
      DECISION_API_TOKEN: ${DECISION_API_TOKEN:-}
      DECISION_FEEDBACK_RETENTION_DAYS: ${DECISION_FEEDBACK_RETENTION_DAYS:-0}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9090}
      LISTEN_ADDR: ${LISTEN_ADDR:-:9090}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1:9090}:9090"
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kasane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kasane}
    volumes:
      - ${POSTGRES_STORAGE:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  qdrant:
    image: qdrant/qdrant:v1.19.1
    # Bounded restarts that still survive reboots: `unless-stopped` brings
    # Qdrant back after a host restart (`on-failure:N` would not), while the
    # guard stops starting it after 5 consecutive failed runs instead of
    # crash-looping on corrupted storage. See docs/operations.md. Kasane keeps
    # working from PostgreSQL while Qdrant is down.
    restart: unless-stopped
    entrypoint: ["bash", "/kasane/qdrant-guard.sh"]
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp. /readyz needs no API key.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r status <&3 && [[ $$status == *' 200 '* ]]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - ${QDRANT_STORAGE:-qdrant-data}:/qdrant/storage
      - ./deploy/qdrant-guard.sh:/kasane/qdrant-guard.sh:ro

volumes:
  postgres-data:
  qdrant-data:
